<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Universe - Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../Public/css/styles.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-space-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="DashboardCliente.html">
                <img src="../../Public/img/logo_actualizado_Sin_Texto.png" alt="Logo" class="brand-img" style="height: 35px;">
                <span class="h2 mb-0 brand-title text-white">Pets<span>Universe</span></span>
            </a>
            <div class="ms-auto">
                <a href="DashboardCliente.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="bi bi-arrow-left me-1"></i> Volver al Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL: CONFIGURACIÓN -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <h2 class="fw-bold text-dark mb-1">Configuración y Seguridad</h2>
                    <p class="text-muted small mb-4">Administra las credenciales de acceso y preferencias de canales de notificación.</p>

                    <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-shield-lock-fill me-2 text-pets-blue"></i> Seguridad de Cuenta</h5>
                    <form class="mb-5">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Contraseña Actual</label>
                            <input type="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nueva Contraseña</label>
                            <input type="password" class="form-control" placeholder="Mínimo 8 caracteres" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Confirmar Nueva Contraseña</label>
                            <input type="password" class="form-control" placeholder="Repite la nueva contraseña" required>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-dark rounded-pill px-4">Actualizar Credenciales</button>
                        </div>
                    </form>

                    <hr class="mb-4">

                    <h5 class="fw-bold text-secondary mb-3"><i class="bi bi-bell-fill me-2 text-pets-blue"></i> Preferencias de Notificación</h5>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="notifEmail" checked>
                        <label class="form-check-label small text-dark fw-medium" for="notifEmail">Recibir confirmaciones y estados de citas por correo electrónico</label>
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="notifWp" checked>
                        <label class="form-check-label small text-dark fw-medium" for="notifWp">Recordatorios automáticos de citas vía WhatsApp</label>
                    </div>
                    <div class="text-end">
                        <button type="button" class="btn btn-primary rounded-pill px-4">Guardar Preferencias</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../Public/js/scripts.js"></script>
</body>
</html>
