<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Universe - Recuperar Contraseña</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../Public/css/styles.css">
</head>
<body class="page-auth">

<div class="login-container">

    <div class="side-visual">
        <div class="visual-content">
            <img src="../../Public/img/logo_actualizado.png" alt="Logo Pets Universe" class="brand-logo-main">
            <h3 class="mt-4 fw-bold" style="color: var(--universe-gold);">¿Olvidaste tu acceso?</h3>
            <p class="quote-text">"No te preocupes, te ayudamos a volver con tus mascotas"</p>
        </div>
    </div>

    <div class="side-form">
        <div class="brand-header mb-4">
            <img src="../../Public/img/icono2.0Sin_Fondo.png" alt="Icono" class="brand-mini-icon">
            <h2>Pets<span>Universe</span></h2>
        </div>

        <h4 class="form-title fw-bold">Recuperar Contraseña</h4>
        <p class="form-subtitle text-muted mb-4">Ingresa tu correo registrado y te enviaremos las instrucciones para restablecer tu cuenta.</p>

        <form action="#" method="POST">
            <div class="mb-4">
                <label class="form-label">Correo Electrónico</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-envelope icon-input"></i>
                    <input type="email" name="correo" class="form-control custom-input" placeholder="nombre@correo.com" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100">ENVIAR INSTRUCCIONES</button>
        </form>

        <div class="login-footer">
            <p class="small text-muted mb-0">¿Recordaste tu contraseña? <a href="Login.html" class="create-account-link">Inicia sesión</a></p>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
