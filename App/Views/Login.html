<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Universe - Acceso al Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../Public/css/styles.css">
</head>
<body class="page-auth">

<div class="login-container">

    <!-- PANEL VISUAL IZQUIERDO -->
    <div class="side-visual">
        <img src="../../Public/img/logo_actualizado.png" alt="Logo Pets Universe">
        <h3 class="mt-4 fw-bold" style="color: var(--universe-gold);">¡Bienvenidos!</h3>
        <p class="small">"Amamos a los animales tanto como tú".</p>
    </div>

    <!-- FORMULARIO DERECHO -->
    <div class="side-form">
        <div class="brand-header">
            <img src="../../Public/img/icono2.0Sin_Fondo.png" alt="Icono">
            <h2>Pets<span>Universe</span></h2>
        </div>

        <h5 class="mb-4 fw-bold">Iniciar Sesión</h5>

        <form action="Login" method="POST">
            
            <label class="form-label">CORREO ELECTRÓNICO</label>
            <div class="input-icon-wrapper mb-3">
                <i class="bi bi-envelope-fill icon-input"></i>
                <input type="email" name="txtUsuario" class="form-control" placeholder="nombre@correo.com" required>
            </div>

            <label class="form-label">CONTRASEÑA</label>
            <div class="input-icon-wrapper mb-2">
                <i class="bi bi-lock-fill icon-input"></i>
                <input type="password" name="txtClave" id="txtClave" class="form-control" placeholder="••••••••" required>
                <i class="bi bi-eye-slash toggle-password" data-toggle-password="txtClave"></i>
            </div>

            <div class="text-end mb-3">
                <a href="RecuperarClave.html" class="small text-muted text-decoration-none">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-access w-100">ENTRAR</button>
        </form>

        <div class="login-footer">
            <p class="small text-muted mb-0">¿Aún no tienes cuenta?</p>
            <a href="Registro.html" class="create-account-link">Crear una cuenta nueva</a>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../Public/js/scripts.js"></script>
</body>
</html>
