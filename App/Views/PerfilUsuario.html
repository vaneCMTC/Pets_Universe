<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pets Universe - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../Public/css/styles.css">
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-space-dark sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="DashboardCliente.html">
                <img src="../../Public/img/logo_actualizado_Sin_Texto.png" alt="Logo" class="brand-img" style="height: 32px;">
                <span class="h3 mb-0 brand-title text-white">Pets<span>Universe</span></span>
            </a>
            <div class="ms-auto">
                <a href="DashboardUsuario.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="bi bi-arrow-left me-1"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-3">
        <div class="row g-3">
            
            <!-- TARJETA LATERAL IZQUIERDA (FOTO Y ROL) -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-3 text-center bg-white h-100 d-flex flex-column justify-content-center">
                    <div class="position-relative d-inline-block mx-auto mb-2">
                        <div class="user-avatar-sm bg-pets-blue text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-4 shadow-sm mx-auto" style="width: 75px; height: 75px;">
                            <span>Anni</span>
                        </div>
                        <label for="avatarInput" class="position-absolute bottom-0 end-0 bg-dark text-white rounded-circle p-1 shadow-sm" style="cursor: pointer; font-size: 10px;" title="Cambiar foto">
                            <i class="bi bi-camera-fill"></i>
                        </label>
                        <input type="file" id="avatarInput" class="d-none" accept="image/*">
                    </div>
                    <h5 class="fw-bold text-dark mb-0">Ani</h5>
                    <p class="text-muted small mb-2">Cliente / Propietario</p>
                </div>
            </div>

            <!-- FORMULARIO DE INFORMACIÓN PERSONAL EDITABLE -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold text-dark mb-3">Información Personal Editable</h5>
                    
                    <form id="formPerfil">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold mb-1">Nombre</label>
                                <input type="text" class="form-control form-control-sm" value="Annie" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold mb-1">Apellido</label>
                                <input type="text" class="form-control form-control-sm" value="Perez" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold mb-1">Correo Electrónico</label>
                                <input type="email" class="form-control form-control-sm" value="test@petsuniverse.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold mb-1">Teléfono / Celular</label>
                                <input type="tel" class="form-control form-control-sm" value="+57 300 1234567" required>
                            </div>
                            <div class="col-12 text-end mt-3">
                                <button type="submit" class="btn btn-primary btn-sm rounded-pill px-4">Guardar Cambios</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../Public/js/scripts.js"></script>
</body>
</html>
